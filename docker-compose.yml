version: "3.9"

services:
  whisper-api:
    build: .
    container_name: transcription-service
    image: whisper-api-transcription
    ports:
      - "9000:8000"   # Host:Container (so you call localhost:9000, inside runs on 8000)
    volumes:
      - ./jobs:/app/jobs   # store transcription results outside container
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
